<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brick Breaker</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      #game {
        text-align: center;
      }
      #score {
        font-size: 14px;
        font-weight: 600;
        color: #1f2937;
        margin-bottom: 6px;
      }
      #hint {
        font-size: 12px;
        color: #64748b;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div id="game">
      <div id="score">점수: 0 · 라이프: 3</div>
      <div id="hint">← → 이동 · 스페이스 시작/일시정지</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.min.js"></script>
    <script>
      const scoreEl = document.getElementById("score");
      let score = 0;
      let lives = 3;
      let running = false;

      const config = {
        type: Phaser.AUTO,
        width: 420,
        height: 320,
        parent: "game",
        backgroundColor: "#f8fafc",
        physics: { default: "arcade", arcade: { gravity: { y: 0 }, debug: false } },
        scene: {
          preload,
          create,
          update,
        },
      };

      const game = new Phaser.Game(config);
      let paddle, ball, bricks, cursors;

      function preload() {}

      function create() {
        cursors = this.input.keyboard.createCursorKeys();
        this.input.keyboard.on("keydown-SPACE", () => {
          running = !running;
          if (running && ball.body.velocity.y === 0) {
            ball.setVelocity(150, -150);
          }
        });

        paddle = this.add.rectangle(210, 300, 70, 12, 0x7c3aed);
        this.physics.add.existing(paddle, true);

        ball = this.add.circle(210, 220, 6, 0xf97316);
        this.physics.add.existing(ball);
        ball.body.setCollideWorldBounds(true);
        ball.body.setBounce(1, 1);
        ball.body.setVelocity(0, 0);

        bricks = this.physics.add.staticGroup();
        const colors = [0x60a5fa, 0xa78bfa];
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 8; c++) {
            const brick = this.add.rectangle(40 + c * 46, 40 + r * 18, 40, 12, colors[(r + c) % 2]);
            bricks.add(brick);
          }
        }

        this.physics.add.collider(ball, paddle, () => {});
        this.physics.add.collider(ball, bricks, (_ball, brick) => {
          brick.destroy();
          score += 1;
          updateScore();
          if (bricks.countActive() === 0) {
            running = false;
          }
        });
      }

      function update() {
        if (!running) {
          ball.body.setVelocity(0, 0);
        }

        if (cursors.left.isDown) {
          paddle.x = Math.max(40, paddle.x - 6);
        } else if (cursors.right.isDown) {
          paddle.x = Math.min(380, paddle.x + 6);
        }
        paddle.body.updateFromGameObject();

        if (ball.y > 320) {
          lives -= 1;
          running = false;
          ball.x = 210;
          ball.y = 220;
          if (lives <= 0) {
            lives = 3;
            score = 0;
          }
          updateScore();
        }
      }

      function updateScore() {
        scoreEl.textContent = `점수: ${score} · 라이프: ${lives}`;
      }
    </script>
  </body>
</html>
