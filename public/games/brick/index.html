<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brick Breaker</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      #wrap {
        text-align: center;
      }
      canvas {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
      }
      .info {
        margin-top: 8px;
        font-size: 12px;
        color: #64748b;
      }
      .score {
        font-weight: 600;
        color: #1f2937;
        margin-bottom: 6px;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div class="score">점수: <span id="score">0</span></div>
      <canvas id="board" width="420" height="320"></canvas>
      <div class="info">← → 이동 · 스페이스 시작/일시정지</div>
    </div>
    <script>
      const canvas = document.getElementById("board");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const paddle = { w: 70, h: 10, x: 175, y: 300, speed: 6 };
      let ball = { x: 210, y: 180, r: 6, dx: 3, dy: -3 };
      let bricks = [];
      let running = false;
      let score = 0;

      function initBricks() {
        bricks = [];
        const rows = 4;
        const cols = 8;
        const bw = 46;
        const bh = 14;
        const gap = 6;
        const offsetX = 12;
        const offsetY = 24;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            bricks.push({
              x: offsetX + c * (bw + gap),
              y: offsetY + r * (bh + gap),
              w: bw,
              h: bh,
              alive: true,
            });
          }
        }
      }

      function reset() {
        paddle.x = 175;
        ball = { x: 210, y: 180, r: 6, dx: 3, dy: -3 };
        score = 0;
        scoreEl.textContent = "0";
        initBricks();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#7c3aed";
        ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
        ctx.fillStyle = "#f97316";
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
        bricks.forEach((b, idx) => {
          if (!b.alive) return;
          ctx.fillStyle = idx % 2 ? "#60a5fa" : "#a78bfa";
          ctx.fillRect(b.x, b.y, b.w, b.h);
        });
      }

      function step() {
        if (!running) return;
        ball.x += ball.dx;
        ball.y += ball.dy;

        if (ball.x < ball.r || ball.x > canvas.width - ball.r) {
          ball.dx *= -1;
        }
        if (ball.y < ball.r) {
          ball.dy *= -1;
        }
        if (ball.y > canvas.height) {
          running = false;
        }

        if (
          ball.y + ball.r >= paddle.y &&
          ball.x >= paddle.x &&
          ball.x <= paddle.x + paddle.w
        ) {
          ball.dy = -Math.abs(ball.dy);
        }

        bricks.forEach((b) => {
          if (!b.alive) return;
          if (
            ball.x > b.x &&
            ball.x < b.x + b.w &&
            ball.y - ball.r < b.y + b.h &&
            ball.y + ball.r > b.y
          ) {
            b.alive = false;
            ball.dy *= -1;
            score += 1;
            scoreEl.textContent = String(score);
          }
        });

        draw();
      }

      window.addEventListener("keydown", (e) => {
        if (["ArrowLeft", "ArrowRight", " "].includes(e.key)) {
          e.preventDefault();
        }
        if (e.key === "ArrowLeft") {
          paddle.x = Math.max(0, paddle.x - paddle.speed);
        }
        if (e.key === "ArrowRight") {
          paddle.x = Math.min(canvas.width - paddle.w, paddle.x + paddle.speed);
        }
        if (e.key === " ") {
          running = !running;
        }
      });

      reset();
      draw();
      setInterval(step, 16);
    </script>
  </body>
</html>
