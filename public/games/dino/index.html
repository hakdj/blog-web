<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, initial-scale=1.0" />
    <title>Dino Run</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #cfd2d9 0%, #aeb4c1 100%);
        font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      }
      .frame {
        position: relative;
        width: 720px;
        height: 540px;
        background: #c0c0c0;
        border: 2px solid #8b8b8b;
        border-top-color: #f5f5f5;
        border-left-color: #f5f5f5;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .panel {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #9aa0ad;
        border: 2px inset #b9bfcc;
        color: #fff;
        padding: 8px 10px;
        font-weight: 700;
      }
      .panel-right {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .panel button {
        border: 2px outset #d9d9d9;
        background: #c9c9c9;
        color: #202020;
        font-weight: 700;
        padding: 5px 12px;
        cursor: pointer;
      }
      .panel button:active {
        border-style: inset;
      }
      .game-wrap {
        flex: 1;
        min-height: 0;
        background: #8c929f;
        border: 2px inset #b9bfcc;
        padding: 12px;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg, #d4d8e0 0%, #c5ccd8 55%, #b9c0cd 100%);
        border: 2px inset #d3d9e5;
      }
      .status {
        text-align: center;
        font-size: 14px;
        color: #2b2b2b;
      }
      .start-overlay {
        position: absolute;
        inset: 14px;
        background: rgba(119, 124, 136, 0.88);
        border: 2px inset #d4d9e1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 12px;
        z-index: 5;
      }
      .start-overlay h2 {
        margin: 0;
        color: #fff;
      }
      .start-overlay p {
        margin: 0;
        color: #eef2fb;
        font-size: 14px;
      }
      .start-btn {
        border: 2px outset #d9d9d9;
        background: #c9c9c9;
        color: #202020;
        font-weight: 700;
        padding: 8px 20px;
        cursor: pointer;
      }
      .start-btn:active {
        border-style: inset;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="panel">
        <span>Dino Run</span>
        <div class="panel-right">
          <span id="score">점수: 0</span>
          <span id="best">최고: 0</span>
          <button id="restartBtn">새 게임</button>
        </div>
      </div>
      <div class="game-wrap">
        <canvas id="gameCanvas" width="680" height="430"></canvas>
      </div>
      <div id="status" class="status">조작: Space/위 방향키 점프, 아래 방향키 숙이기</div>
      <div id="startOverlay" class="start-overlay">
        <h2>Dino Run</h2>
        <p>장애물을 점프/숙이기로 피해서 오래 버티세요.</p>
        <p>조작: Space/↑ 점프 · ↓ 숙이기</p>
        <button id="startBtn" class="start-btn">게임 시작</button>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const statusEl = document.getElementById("status");
      const startOverlay = document.getElementById("startOverlay");
      const startBtn = document.getElementById("startBtn");
      const restartBtn = document.getElementById("restartBtn");

      let started = false;
      let gameOver = false;
      let frameReq = null;
      let score = 0;
      let best = Number(localStorage.getItem("retroDinoBest") || "0");
      let speed = 5.5;
      let spawnTick = 0;

      const gravity = 0.65;
      const groundY = 350;

      const dino = {
        x: 80,
        y: groundY - 58,
        width: 44,
        height: 58,
        vy: 0,
        jumping: false,
        ducking: false,
      };

      const obstacles = [];
      const clouds = [
        { x: 120, y: 70, w: 62, h: 20, speed: 0.8 },
        { x: 390, y: 95, w: 48, h: 16, speed: 0.65 },
      ];

      function resetGame() {
        score = 0;
        speed = 5.5;
        spawnTick = 0;
        gameOver = false;
        obstacles.length = 0;
        dino.y = groundY - 58;
        dino.width = 44;
        dino.height = 58;
        dino.vy = 0;
        dino.jumping = false;
        dino.ducking = false;
        statusEl.textContent = "조작: Space/위 방향키 점프, 아래 방향키 숙이기";
        updateHud();
      }

      function updateHud() {
        scoreEl.textContent = `점수: ${Math.floor(score)}`;
        bestEl.textContent = `최고: ${best}`;
      }

      function jump() {
        if (dino.jumping || gameOver) return;
        dino.vy = -12.8;
        dino.jumping = true;
      }

      function setDuck(on) {
        if (gameOver) return;
        if (on && !dino.jumping) {
          dino.ducking = true;
          dino.height = 38;
          dino.width = 56;
          dino.y = groundY - dino.height;
        } else {
          dino.ducking = false;
          dino.height = 58;
          dino.width = 44;
          dino.y = groundY - dino.height;
        }
      }

      function spawnObstacle() {
        const tall = Math.random() < 0.65;
        const width = tall ? 26 : 44;
        const height = tall ? 56 : 34;
        const y = groundY - height;
        obstacles.push({
          x: canvas.width + 20,
          y,
          w: width,
          h: height,
        });
      }

      function intersects(a, b) {
        return !(
          a.x + a.w < b.x ||
          a.x > b.x + b.w ||
          a.y + a.h < b.y ||
          a.y > b.y + b.h
        );
      }

      function drawCloud(cloud) {
        ctx.fillStyle = "#dfe5ee";
        ctx.fillRect(cloud.x, cloud.y, cloud.w, cloud.h);
        ctx.fillRect(cloud.x + 10, cloud.y - 8, cloud.w - 20, cloud.h);
      }

      function drawDino() {
        ctx.fillStyle = "#2d3543";
        ctx.fillRect(dino.x, dino.y, dino.width, dino.height);
        ctx.fillStyle = "#7f8ca3";
        ctx.fillRect(dino.x + 8, dino.y + 10, dino.width - 16, 6);
      }

      function drawObstacle(ob) {
        ctx.fillStyle = "#7a4350";
        ctx.fillRect(ob.x, ob.y, ob.w, ob.h);
        ctx.fillStyle = "#ab5f6b";
        ctx.fillRect(ob.x + 4, ob.y + 6, ob.w - 8, 6);
      }

      function update() {
        dino.vy += gravity;
        dino.y += dino.vy;

        if (dino.y >= groundY - dino.height) {
          dino.y = groundY - dino.height;
          dino.vy = 0;
          dino.jumping = false;
        }

        spawnTick += 1;
        const threshold = Math.max(60, 140 - speed * 8);
        if (spawnTick > threshold) {
          spawnObstacle();
          spawnTick = Math.floor(Math.random() * 35);
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const ob = obstacles[i];
          ob.x -= speed;
          if (ob.x + ob.w < -10) obstacles.splice(i, 1);
        }

        for (const cloud of clouds) {
          cloud.x -= cloud.speed;
          if (cloud.x + cloud.w < -40) cloud.x = canvas.width + 20 + Math.random() * 160;
        }

        const hitbox = {
          x: dino.x + 5,
          y: dino.y + 4,
          w: dino.width - 10,
          h: dino.height - 6,
        };
        for (const ob of obstacles) {
          if (intersects(hitbox, ob)) {
            gameOver = true;
            statusEl.textContent = "게임 오버! 새 게임 버튼으로 다시 시작하세요.";
            return;
          }
        }

        score += 0.1;
        if (Math.floor(score) % 120 === 0) {
          speed = Math.min(12, speed + 0.002);
        }
        if (Math.floor(score) > best) {
          best = Math.floor(score);
          localStorage.setItem("retroDinoBest", String(best));
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "#667186";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, groundY + 1);
        ctx.lineTo(canvas.width, groundY + 1);
        ctx.stroke();

        for (const cloud of clouds) drawCloud(cloud);
        drawDino();
        for (const ob of obstacles) drawObstacle(ob);
      }

      function tick() {
        if (!started) return;
        if (!gameOver) update();
        draw();
        updateHud();
        frameReq = window.requestAnimationFrame(tick);
      }

      window.addEventListener("keydown", (event) => {
        if (event.code === "Space" || event.code === "ArrowUp") {
          event.preventDefault();
          jump();
        } else if (event.code === "ArrowDown") {
          event.preventDefault();
          setDuck(true);
        }
      });

      window.addEventListener("keyup", (event) => {
        if (event.code === "ArrowDown") setDuck(false);
      });

      startBtn.addEventListener("click", () => {
        started = true;
        startOverlay.style.display = "none";
        resetGame();
        if (frameReq) window.cancelAnimationFrame(frameReq);
        frameReq = window.requestAnimationFrame(tick);
      });

      restartBtn.addEventListener("click", () => {
        if (!started) return;
        resetGame();
      });

      updateHud();
      draw();
    </script>
  </body>
</html>
