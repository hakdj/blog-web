<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1945 Mini</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      #wrap {
        text-align: center;
      }
      #info {
        font-size: 13px;
        color: #f8fafc;
        margin-bottom: 6px;
      }
      #hint {
        font-size: 12px;
        color: #94a3b8;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="info">점수: 0 · 라이프: 3</div>
      <div id="hint">← → 이동 · 스페이스 공격</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.min.js"></script>
    <script>
      const infoEl = document.getElementById("info");
      let score = 0;
      let lives = 3;

      const config = {
        type: Phaser.AUTO,
        width: 360,
        height: 420,
        parent: "wrap",
        backgroundColor: "#0f172a",
        physics: { default: "arcade", arcade: { gravity: { y: 0 }, debug: false } },
        scene: { create, update },
      };

      new Phaser.Game(config);
      let player, bullets, enemies, cursors, fireKey;

      function create() {
        cursors = this.input.keyboard.createCursorKeys();
        fireKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
        player = this.add.rectangle(180, 380, 26, 18, 0x38bdf8);
        this.physics.add.existing(player);
        player.body.setCollideWorldBounds(true);

        bullets = this.physics.add.group();
        enemies = this.physics.add.group();

        this.time.addEvent({
          delay: 600,
          loop: true,
          callback: () => spawnEnemy(this),
        });

        this.physics.add.overlap(bullets, enemies, (_, enemy) => {
          enemy.destroy();
          score += 1;
          updateInfo();
        });
      }

      function update() {
        if (cursors.left.isDown) {
          player.x = Math.max(20, player.x - 5);
        } else if (cursors.right.isDown) {
          player.x = Math.min(340, player.x + 5);
        }
        player.body.updateFromGameObject();

        if (Phaser.Input.Keyboard.JustDown(fireKey)) {
          const bullet = this.add.rectangle(player.x, player.y - 12, 4, 10, 0xfbbf24);
          this.physics.add.existing(bullet);
          bullet.body.setVelocityY(-300);
          bullets.add(bullet);
        }

        enemies.getChildren().forEach((enemy) => {
          if (enemy.y > 420) {
            enemy.destroy();
            lives -= 1;
            updateInfo();
            if (lives <= 0) {
              lives = 3;
              score = 0;
              updateInfo();
            }
          }
          if (Phaser.Geom.Intersects.RectangleToRectangle(player.getBounds(), enemy.getBounds())) {
            enemy.destroy();
            lives -= 1;
            updateInfo();
          }
        });
      }

      function spawnEnemy(scene) {
        const enemy = scene.add.rectangle(Math.random() * 320 + 20, -20, 20, 20, 0xef4444);
        scene.physics.add.existing(enemy);
        enemy.body.setVelocityY(100 + Math.random() * 80);
        enemies.add(enemy);
      }

      function updateInfo() {
        infoEl.textContent = `점수: ${score} · 라이프: ${lives}`;
      }
    </script>
  </body>
</html>
