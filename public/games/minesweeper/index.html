<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=740, initial-scale=1.0" />
    <title>지뢰찾기</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #cfd2d9 0%, #aeb4c1 100%);
        font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      }
      .frame {
        position: relative;
        width: min(740px, 100vw);
        height: min(560px, 100vh);
        background: #c0c0c0;
        border: 2px solid #8b8b8b;
        border-top-color: #f5f5f5;
        border-left-color: #f5f5f5;
        padding: 14px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .panel {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #9aa0ad;
        border: 2px inset #b9bfcc;
        color: #ffffff;
        padding: 8px 10px;
        margin-bottom: 10px;
        font-weight: 700;
      }
      .panel button {
        border: 2px outset #d9d9d9;
        background: #c9c9c9;
        color: #202020;
        font-weight: 700;
        padding: 5px 12px;
        cursor: pointer;
      }
      .panel button:active { border-style: inset; }
      .panel select {
        border: 2px inset #d9d9d9;
        background: #d6dae3;
        color: #202020;
        font-weight: 700;
        padding: 4px 8px;
      }
      .board-wrap {
        flex: 1;
        min-height: 0;
        background: #8c929f;
        border: 2px inset #b9bfcc;
        padding: 8px;
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .board {
        display: grid;
        gap: 2px;
        width: 520px;
        height: 520px;
        justify-content: center;
      }
      .cell {
        width: 100%;
        height: 100%;
        border: 2px outset #d9d9d9;
        background: #c9c9c9;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: clamp(12px, 2vw, 22px);
        cursor: pointer;
        user-select: none;
      }
      .cell.open {
        border: 1px solid #8a8a8a;
        background: #b8bcc5;
      }
      .cell.mine {
        background: #d15a5a;
        color: #fff;
      }
      .status {
        text-align: center;
        margin-top: 8px;
        font-size: 14px;
        color: #2b2b2b;
        flex-shrink: 0;
      }
      .start-overlay {
        position: absolute;
        inset: 14px;
        background: rgba(119, 124, 136, 0.88);
        border: 2px inset #d4d9e1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 12px;
        z-index: 5;
      }
      .start-overlay h2 {
        margin: 0;
        color: #ffffff;
      }
      .start-overlay p {
        margin: 0;
        color: #eef2fb;
        font-size: 14px;
      }
      .start-btn {
        border: 2px outset #d9d9d9;
        background: #c9c9c9;
        color: #202020;
        font-weight: 700;
        padding: 8px 20px;
        cursor: pointer;
      }
      .start-btn:active {
        border-style: inset;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="panel">
        <span id="mineCount">지뢰: 10</span>
        <select id="levelSelect" aria-label="난이도 선택">
          <option value="easy">1단계 (9x9)</option>
          <option value="normal">2단계 (12x12)</option>
          <option value="hard">3단계 (16x16)</option>
        </select>
        <button id="resetBtn">새 게임</button>
        <span id="time">시간: 0초</span>
      </div>
      <div class="board-wrap">
        <div id="board" class="board"></div>
      </div>
      <div id="status" class="status">좌클릭으로 열기, 우클릭으로 깃발</div>
      <div id="startOverlay" class="start-overlay">
        <h2>지뢰찾기</h2>
        <p>숫자 힌트를 보고 지뢰를 모두 피하세요.</p>
        <p>좌클릭 열기 · 우클릭 깃발</p>
        <button id="startBtn" class="start-btn">게임 시작</button>
      </div>
    </div>

    <script>
      const LEVELS = {
        easy: { label: "1단계", rows: 9, cols: 9, mines: 10 },
        normal: { label: "2단계", rows: 12, cols: 12, mines: 24 },
        hard: { label: "3단계", rows: 16, cols: 16, mines: 40 },
      };
      let currentLevelKey = "easy";
      const boardEl = document.getElementById("board");
      const levelSelect = document.getElementById("levelSelect");
      const statusEl = document.getElementById("status");
      const mineCountEl = document.getElementById("mineCount");
      const timeEl = document.getElementById("time");
      const resetBtn = document.getElementById("resetBtn");
      const startOverlay = document.getElementById("startOverlay");
      const startBtn = document.getElementById("startBtn");

      let board = [];
      let started = false;
      let gameOver = false;
      let openedCount = 0;
      let flags = 0;
      let timer = 0;
      let timerHandle = null;

      function getCurrentLevel() {
        return LEVELS[currentLevelKey] || LEVELS.easy;
      }

      function createBoard(rows, cols, mines) {
        const next = Array.from({ length: rows }, () =>
          Array.from({ length: cols }, () => ({
            isMine: false,
            isOpen: false,
            isFlagged: false,
            neighborCount: 0,
          }))
        );

        let placed = 0;
        while (placed < mines) {
          const r = Math.floor(Math.random() * rows);
          const c = Math.floor(Math.random() * cols);
          if (next[r][c].isMine) continue;
          next[r][c].isMine = true;
          placed += 1;
        }

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (next[r][c].isMine) continue;
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                if (!dr && !dc) continue;
                const nr = r + dr;
                const nc = c + dc;
                if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
                if (next[nr][nc].isMine) count += 1;
              }
            }
            next[r][c].neighborCount = count;
          }
        }
        return next;
      }

      function stopTimer() {
        if (timerHandle) {
          clearInterval(timerHandle);
          timerHandle = null;
        }
      }

      function startTimer() {
        stopTimer();
        timerHandle = setInterval(() => {
          timer += 1;
          timeEl.textContent = `시간: ${timer}초`;
        }, 1000);
      }

      function revealAllMines() {
        const level = getCurrentLevel();
        for (let r = 0; r < level.rows; r++) {
          for (let c = 0; c < level.cols; c++) {
            if (board[r][c].isMine) board[r][c].isOpen = true;
          }
        }
      }

      function floodFill(sr, sc) {
        const level = getCurrentLevel();
        const stack = [[sr, sc]];
        while (stack.length > 0) {
          const [r, c] = stack.pop();
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (!dr && !dc) continue;
              const nr = r + dr;
              const nc = c + dc;
              if (nr < 0 || nr >= level.rows || nc < 0 || nc >= level.cols) continue;
              const cell = board[nr][nc];
              if (cell.isOpen || cell.isFlagged || cell.isMine) continue;
              cell.isOpen = true;
              openedCount += 1;
              if (cell.neighborCount === 0) stack.push([nr, nc]);
            }
          }
        }
      }

      function handleOpenCell(r, c) {
        if (!started || gameOver) return;
        const level = getCurrentLevel();
        const cell = board[r][c];
        if (cell.isOpen || cell.isFlagged) return;

        cell.isOpen = true;
        openedCount += 1;

        if (cell.isMine) {
          gameOver = true;
          revealAllMines();
          statusEl.textContent = "게임 오버! 지뢰를 밟았습니다.";
          stopTimer();
          render();
          return;
        }

        if (cell.neighborCount === 0) {
          floodFill(r, c);
        }

        if (openedCount >= level.rows * level.cols - level.mines) {
          gameOver = true;
          statusEl.textContent = "성공! 지뢰를 모두 찾았습니다.";
          stopTimer();
        }
      }

      function handleFlagCell(r, c) {
        if (!started || gameOver) return;
        const level = getCurrentLevel();
        const cell = board[r][c];
        if (cell.isOpen) return;
        cell.isFlagged = !cell.isFlagged;
        flags += cell.isFlagged ? 1 : -1;
        mineCountEl.textContent = `지뢰: ${Math.max(0, level.mines - flags)}`;
      }

      function resizeBoard() {
        const wrap = boardEl.parentElement;
        if (!wrap) return;
        const style = window.getComputedStyle(wrap);
        const paddingX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
        const paddingY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
        const contentWidth = wrap.clientWidth - paddingX;
        const contentHeight = wrap.clientHeight - paddingY;
        // 실제 콘텐츠 박스 기준으로 계산해 마지막 줄 잘림 방지
        const maxSide = 520;
        const safety = 4;
        const available = Math.min(contentWidth, contentHeight) - safety;
        const side = Math.max(260, Math.floor(Math.min(available, maxSide)));
        boardEl.style.width = `${side}px`;
        boardEl.style.height = `${side}px`;
      }

      function render() {
        const level = getCurrentLevel();
        boardEl.style.gridTemplateColumns = `repeat(${level.cols}, 1fr)`;
        boardEl.style.gridTemplateRows = `repeat(${level.rows}, 1fr)`;
        resizeBoard();
        boardEl.innerHTML = "";
        for (let r = 0; r < level.rows; r++) {
          for (let c = 0; c < level.cols; c++) {
            const data = board[r][c];
            const cell = document.createElement("div");
            cell.className = "cell";
            if (data.isOpen) cell.classList.add("open");
            if (data.isOpen && data.isMine) cell.classList.add("mine");

            if (data.isFlagged && !data.isOpen) {
              cell.textContent = "🚩";
            } else if (data.isOpen && data.isMine) {
              cell.textContent = "💣";
            } else if (data.isOpen && data.neighborCount > 0) {
              cell.textContent = String(data.neighborCount);
            } else {
              cell.textContent = "";
            }

            cell.addEventListener("click", () => {
              handleOpenCell(r, c);
              render();
            });
            cell.addEventListener("contextmenu", (event) => {
              event.preventDefault();
              handleFlagCell(r, c);
              render();
            });
            boardEl.appendChild(cell);
          }
        }
      }

      function initGame() {
        const level = getCurrentLevel();
        gameOver = false;
        openedCount = 0;
        flags = 0;
        timer = 0;
        mineCountEl.textContent = `지뢰: ${level.mines}`;
        timeEl.textContent = "시간: 0초";
        statusEl.textContent = `${level.label} · 좌클릭 열기, 우클릭 깃발`;
        board = createBoard(level.rows, level.cols, level.mines);
        render();
        if (started) startTimer();
      }

      startBtn.addEventListener("click", () => {
        started = true;
        startOverlay.style.display = "none";
        initGame();
      });
      resetBtn.addEventListener("click", () => {
        if (!started) return;
        initGame();
      });
      levelSelect.addEventListener("change", () => {
        currentLevelKey = levelSelect.value;
        initGame();
      });
      boardEl.addEventListener("contextmenu", (event) => event.preventDefault());
      window.addEventListener("resize", resizeBoard);
      initGame();
    </script>
  </body>
</html>
