<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, initial-scale=1.0" />
    <title>지뢰찾기</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #cfd2d9 0%, #aeb4c1 100%);
        font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      }
      .frame {
        position: relative;
        width: 720px;
        height: 540px;
        background: #c0c0c0;
        border: 2px solid #8b8b8b;
        border-top-color: #f5f5f5;
        border-left-color: #f5f5f5;
        padding: 14px;
      }
      .panel {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #9aa0ad;
        border: 2px inset #b9bfcc;
        color: #ffffff;
        padding: 8px 10px;
        margin-bottom: 10px;
        font-weight: 700;
      }
      .panel button {
        border: 2px outset #d9d9d9;
        background: #c9c9c9;
        color: #202020;
        font-weight: 700;
        padding: 5px 12px;
        cursor: pointer;
      }
      .panel button:active { border-style: inset; }
      .board {
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        gap: 2px;
        background: #7c7c7c;
        border: 2px inset #b9bfcc;
        padding: 8px;
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
      }
      .cell {
        width: 52px;
        height: 52px;
        border: 2px outset #d9d9d9;
        background: #c9c9c9;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 22px;
        cursor: pointer;
        user-select: none;
      }
      .cell.open {
        border: 1px solid #8a8a8a;
        background: #b8bcc5;
      }
      .cell.mine { background: #d15a5a; color: #fff; }
      .num-1 { color: #1b4df3; } .num-2 { color: #0b7f2c; } .num-3 { color: #bf1717; }
      .num-4 { color: #1c2a78; } .num-5 { color: #7b1d1d; } .num-6 { color: #0f7f89; }
      .num-7 { color: #232323; } .num-8 { color: #6b6b6b; }
      .status {
        text-align: center;
        margin-top: 10px;
        font-size: 14px;
        color: #2b2b2b;
      }
      .start-overlay {
        position: absolute;
        inset: 14px;
        background: rgba(119, 124, 136, 0.88);
        border: 2px inset #d4d9e1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 12px;
        z-index: 5;
      }
      .start-overlay h2 {
        margin: 0;
        color: #ffffff;
      }
      .start-overlay p {
        margin: 0;
        color: #eef2fb;
        font-size: 14px;
      }
      .start-btn {
        border: 2px outset #d9d9d9;
        background: #c9c9c9;
        color: #202020;
        font-weight: 700;
        padding: 8px 20px;
        cursor: pointer;
      }
      .start-btn:active { border-style: inset; }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="panel">
        <span id="mineCount">지뢰: 10</span>
        <button id="resetBtn">새 게임</button>
        <span id="time">시간: 0초</span>
      </div>
      <div id="board" class="board"></div>
      <div id="status" class="status">좌클릭으로 열기, 우클릭으로 깃발</div>
      <div id="startOverlay" class="start-overlay">
        <h2>지뢰찾기</h2>
        <p>숫자 힌트를 보고 지뢰를 모두 피하세요.</p>
        <p>좌클릭 열기 · 우클릭 깃발</p>
        <button id="startBtn" class="start-btn">게임 시작</button>
      </div>
    </div>

    <script>
      const SIZE = 9;
      const MINES = 10;
      const boardEl = document.getElementById("board");
      const statusEl = document.getElementById("status");
      const mineCountEl = document.getElementById("mineCount");
      const timeEl = document.getElementById("time");
      const resetBtn = document.getElementById("resetBtn");
      const startOverlay = document.getElementById("startOverlay");
      const startBtn = document.getElementById("startBtn");

      let board = [];
      let gameOver = false;
      let started = false;
      let openedCount = 0;
      let flags = 0;
      let timer = 0;
      let timerHandle = null;

      function makeBoard() {
        board = Array.from({ length: SIZE }, () =>
          Array.from({ length: SIZE }, () => ({ mine: false, open: false, flag: false, count: 0 }))
        );
      }

      function placeMines() {
        let left = MINES;
        while (left > 0) {
          const r = Math.floor(Math.random() * SIZE);
          const c = Math.floor(Math.random() * SIZE);
          if (board[r][c].mine) continue;
          board[r][c].mine = true;
          left -= 1;
        }
      }

      function calcCounts() {
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (board[r][c].mine) continue;
            let n = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                if (!dr && !dc) continue;
                const nr = r + dr;
                const nc = c + dc;
                if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) continue;
                if (board[nr][nc].mine) n += 1;
              }
            }
            board[r][c].count = n;
          }
        }
      }

      function openCell(r, c) {
        if (!started) return;
        const cell = board[r][c];
        if (gameOver || cell.open || cell.flag) return;
        cell.open = true;
        openedCount += 1;

        if (cell.mine) {
          gameOver = true;
          revealAllMines();
          statusEl.textContent = "게임 오버! 지뢰를 밟았습니다.";
          stopTimer();
          render();
          return;
        }

        if (cell.count === 0) {
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (!dr && !dc) continue;
              const nr = r + dr;
              const nc = c + dc;
              if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) continue;
              openCell(nr, nc);
            }
          }
        }

        if (openedCount === SIZE * SIZE - MINES) {
          gameOver = true;
          statusEl.textContent = "성공! 지뢰를 모두 피했습니다.";
          stopTimer();
        }
      }

      function toggleFlag(r, c) {
        if (!started) return;
        const cell = board[r][c];
        if (gameOver || cell.open) return;
        cell.flag = !cell.flag;
        flags += cell.flag ? 1 : -1;
        mineCountEl.textContent = `지뢰: ${Math.max(0, MINES - flags)}`;
        render();
      }

      function revealAllMines() {
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (board[r][c].mine) board[r][c].open = true;
          }
        }
      }

      function render() {
        boardEl.innerHTML = "";
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const data = board[r][c];
            const cell = document.createElement("div");
            cell.className = "cell";
            if (data.open) cell.classList.add("open");
            if (data.open && data.mine) cell.classList.add("mine");

            if (data.flag && !data.open) {
              cell.textContent = "🚩";
            } else if (data.open && data.mine) {
              cell.textContent = "💣";
            } else if (data.open && data.count > 0) {
              cell.textContent = String(data.count);
              cell.classList.add(`num-${data.count}`);
            } else {
              cell.textContent = "";
            }

            cell.addEventListener("click", () => openCell(r, c));
            cell.addEventListener("contextmenu", (e) => {
              e.preventDefault();
              toggleFlag(r, c);
            });
            boardEl.appendChild(cell);
          }
        }
      }

      function stopTimer() {
        if (timerHandle) {
          clearInterval(timerHandle);
          timerHandle = null;
        }
      }

      function startTimer() {
        stopTimer();
        timerHandle = setInterval(() => {
          timer += 1;
          timeEl.textContent = `시간: ${timer}초`;
        }, 1000);
      }

      function init() {
        gameOver = false;
        openedCount = 0;
        flags = 0;
        timer = 0;
        mineCountEl.textContent = `지뢰: ${MINES}`;
        timeEl.textContent = "시간: 0초";
        statusEl.textContent = "좌클릭으로 열기, 우클릭으로 깃발";
        makeBoard();
        placeMines();
        calcCounts();
        render();
        if (started) {
          startTimer();
        } else {
          stopTimer();
        }
      }

      resetBtn.addEventListener("click", () => {
        started = true;
        startOverlay.style.display = "none";
        init();
      });
      startBtn.addEventListener("click", () => {
        started = true;
        startOverlay.style.display = "none";
        init();
      });
      boardEl.addEventListener("contextmenu", (e) => e.preventDefault());
      init();
    </script>
  </body>
</html>
