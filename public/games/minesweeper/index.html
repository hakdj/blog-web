<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, initial-scale=1.0" />
    <title>지뢰찾기</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #cfd2d9 0%, #aeb4c1 100%);
        font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      }
      .frame {
        position: relative;
        width: 720px;
        height: 540px;
        background: #c0c0c0;
        border: 2px solid #8b8b8b;
        border-top-color: #f5f5f5;
        border-left-color: #f5f5f5;
        padding: 14px;
      }
      .panel {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #9aa0ad;
        border: 2px inset #b9bfcc;
        color: #ffffff;
        padding: 8px 10px;
        margin-bottom: 10px;
        font-weight: 700;
      }
      .panel button {
        border: 2px outset #d9d9d9;
        background: #c9c9c9;
        color: #202020;
        font-weight: 700;
        padding: 5px 12px;
        cursor: pointer;
      }
      .panel button:active {
        border-style: inset;
      }
      .board-wrap {
        display: grid;
        place-items: center;
        height: calc(100% - 90px);
        background: #8c929f;
        border: 2px inset #b9bfcc;
        padding: 10px;
      }
      mine-sweeper {
        --ms-bg-color: #c9c9c9;
        --ms-open-bg-color: #b8bcc5;
        --ms-border-color: #8a8a8a;
        transform: scale(1.05);
        transform-origin: center center;
      }
      .status {
        text-align: center;
        margin-top: 10px;
        font-size: 14px;
        color: #2b2b2b;
      }
      .start-overlay {
        position: absolute;
        inset: 14px;
        background: rgba(119, 124, 136, 0.88);
        border: 2px inset #d4d9e1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 12px;
        z-index: 5;
      }
      .start-overlay h2 {
        margin: 0;
        color: #ffffff;
      }
      .start-overlay p {
        margin: 0;
        color: #eef2fb;
        font-size: 14px;
      }
      .start-btn {
        border: 2px outset #d9d9d9;
        background: #c9c9c9;
        color: #202020;
        font-weight: 700;
        padding: 8px 20px;
        cursor: pointer;
      }
      .start-btn:active {
        border-style: inset;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="panel">
        <span>지뢰찾기 (모듈 버전)</span>
        <button id="resetBtn">새 게임</button>
        <span>9x9 · 지뢰 10</span>
      </div>
      <div class="board-wrap">
        <mine-sweeper id="mineGame" cols="9" bomb="10"></mine-sweeper>
      </div>
      <div id="status" class="status">좌클릭으로 열기, 우클릭으로 깃발</div>
      <div id="startOverlay" class="start-overlay">
        <h2>지뢰찾기</h2>
        <p>외부 모듈 기반 지뢰찾기입니다.</p>
        <p>좌클릭 열기 · 우클릭 깃발</p>
        <button id="startBtn" class="start-btn">게임 시작</button>
      </div>
    </div>

    <script type="module">
      import { mine_sweeper } from "https://unpkg.com/mine-sweeper-tag@1.0.6/dist/mine-sweeper.es.js";

      if (!customElements.get("mine-sweeper")) {
        customElements.define("mine-sweeper", mine_sweeper);
      }

      const statusEl = document.getElementById("status");
      const resetBtn = document.getElementById("resetBtn");
      const startOverlay = document.getElementById("startOverlay");
      const startBtn = document.getElementById("startBtn");
      let started = false;
      function resetModuleGame() {
        const game = document.getElementById("mineGame");
        if (!game) return;
        const clone = game.cloneNode(false);
        clone.setAttribute("cols", "9");
        clone.setAttribute("bomb", "10");
        game.replaceWith(clone);
        clone.style.visibility = "visible";
        statusEl.textContent = "새 게임이 시작되었습니다.";
      }

      resetBtn.addEventListener("click", () => {
        if (!started) return;
        resetModuleGame();
      });
      startBtn.addEventListener("click", () => {
        started = true;
        startOverlay.style.display = "none";
        statusEl.textContent = "좌클릭으로 열기, 우클릭으로 깃발";
      });

      const initialGame = document.getElementById("mineGame");
      if (initialGame) {
        // 시작 전에는 모듈 게임 숨김
        initialGame.style.visibility = "hidden";
      }
      startBtn.addEventListener("click", () => {
        const currentGame = document.getElementById("mineGame");
        if (currentGame) currentGame.style.visibility = "visible";
      });
    </script>
  </body>
</html>
