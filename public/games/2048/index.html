<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, initial-scale=1.0" />
    <title>2048</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #cfd2d9 0%, #aeb4c1 100%);
        font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      }
      .frame {
        position: relative;
        width: 720px;
        height: 540px;
        background: #c0c0c0;
        border: 2px solid #8b8b8b;
        border-top-color: #f5f5f5;
        border-left-color: #f5f5f5;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .panel {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #9aa0ad;
        border: 2px inset #b9bfcc;
        color: #fff;
        padding: 8px 10px;
        font-weight: 700;
      }
      .panel-right {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .panel button {
        border: 2px outset #d9d9d9;
        background: #c9c9c9;
        color: #202020;
        font-weight: 700;
        padding: 5px 12px;
        cursor: pointer;
      }
      .panel button:active {
        border-style: inset;
      }
      .board-wrap {
        flex: 1;
        min-height: 0;
        background: #8c929f;
        border: 2px inset #b9bfcc;
        display: grid;
        place-items: center;
      }
      .board {
        width: 420px;
        height: 420px;
        background: #7f8898;
        border: 2px inset #b9bfcc;
        padding: 10px;
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(4, 1fr);
      }
      .cell {
        border: 2px inset #c8ced8;
        background: #a1a9b8;
        color: #222;
        font-size: 30px;
        font-weight: 800;
        display: grid;
        place-items: center;
        user-select: none;
      }
      .value-0 {
        color: transparent;
      }
      .value-2 {
        background: #e8ecf5;
      }
      .value-4 {
        background: #dce6f7;
      }
      .value-8 {
        background: #f3d7ab;
      }
      .value-16 {
        background: #efbf87;
      }
      .value-32 {
        background: #e89a72;
      }
      .value-64 {
        background: #df6e6e;
        color: #fff;
      }
      .value-128 {
        background: #c7d86f;
      }
      .value-256 {
        background: #b6cf59;
      }
      .value-512 {
        background: #9fc251;
      }
      .value-1024 {
        background: #7ead4a;
        color: #fff;
      }
      .value-2048 {
        background: #5a9144;
        color: #fff;
      }
      .status {
        text-align: center;
        font-size: 14px;
        color: #2b2b2b;
      }
      .start-overlay {
        position: absolute;
        inset: 14px;
        background: rgba(119, 124, 136, 0.88);
        border: 2px inset #d4d9e1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 12px;
        z-index: 5;
      }
      .start-overlay h2 {
        margin: 0;
        color: #fff;
      }
      .start-overlay p {
        margin: 0;
        color: #eef2fb;
        font-size: 14px;
      }
      .start-btn {
        border: 2px outset #d9d9d9;
        background: #c9c9c9;
        color: #202020;
        font-weight: 700;
        padding: 8px 20px;
        cursor: pointer;
      }
      .start-btn:active {
        border-style: inset;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="panel">
        <span>2048 레트로</span>
        <div class="panel-right">
          <span id="score">점수: 0</span>
          <span id="best">최고: 0</span>
          <button id="restartBtn">새 게임</button>
        </div>
      </div>
      <div class="board-wrap">
        <div id="board" class="board"></div>
      </div>
      <div id="status" class="status">방향키로 타일을 합쳐 2048을 만드세요.</div>
      <div id="startOverlay" class="start-overlay">
        <h2>2048</h2>
        <p>같은 숫자를 합쳐 2048 타일을 만들어보세요.</p>
        <p>조작: 방향키 이동 · 새 게임으로 초기화</p>
        <button id="startBtn" class="start-btn">게임 시작</button>
      </div>
    </div>

    <script>
      const SIZE = 4;
      const boardEl = document.getElementById("board");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const statusEl = document.getElementById("status");
      const restartBtn = document.getElementById("restartBtn");
      const startOverlay = document.getElementById("startOverlay");
      const startBtn = document.getElementById("startBtn");

      let board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
      let score = 0;
      let best = Number(localStorage.getItem("retro2048Best") || "0");
      let started = false;
      let gameOver = false;
      let hasWon = false;

      function updateHeader() {
        scoreEl.textContent = `점수: ${score}`;
        bestEl.textContent = `최고: ${best}`;
      }

      function emptyCells() {
        const cells = [];
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (board[r][c] === 0) cells.push([r, c]);
          }
        }
        return cells;
      }

      function addRandomTile() {
        const empties = emptyCells();
        if (empties.length === 0) return;
        const [r, c] = empties[Math.floor(Math.random() * empties.length)];
        board[r][c] = Math.random() < 0.9 ? 2 : 4;
      }

      function drawBoard() {
        boardEl.innerHTML = "";
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const value = board[r][c];
            const cell = document.createElement("div");
            cell.className = `cell value-${value <= 2048 ? value : 2048}`;
            cell.textContent = value === 0 ? "0" : String(value);
            if (value >= 1024) cell.style.fontSize = "24px";
            if (value >= 2048) cell.style.fontSize = "20px";
            boardEl.appendChild(cell);
          }
        }
      }

      function slideRowLeft(row) {
        const compact = row.filter((n) => n !== 0);
        const next = [];
        let gained = 0;
        for (let i = 0; i < compact.length; i++) {
          if (compact[i] === compact[i + 1]) {
            const merged = compact[i] * 2;
            next.push(merged);
            gained += merged;
            if (merged === 2048) hasWon = true;
            i++;
          } else {
            next.push(compact[i]);
          }
        }
        while (next.length < SIZE) next.push(0);
        return { row: next, gained };
      }

      function cloneBoard(source) {
        return source.map((row) => [...row]);
      }

      function boardsEqual(a, b) {
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (a[r][c] !== b[r][c]) return false;
          }
        }
        return true;
      }

      function transpose(matrix) {
        const out = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            out[c][r] = matrix[r][c];
          }
        }
        return out;
      }

      function reverseRows(matrix) {
        return matrix.map((row) => [...row].reverse());
      }

      function move(direction) {
        if (!started || gameOver) return;

        let next = cloneBoard(board);
        let gained = 0;

        if (direction === "up") next = transpose(next);
        if (direction === "right") next = reverseRows(next);
        if (direction === "down") next = reverseRows(transpose(next));

        next = next.map((row) => {
          const result = slideRowLeft(row);
          gained += result.gained;
          return result.row;
        });

        if (direction === "up") next = transpose(next);
        if (direction === "right") next = reverseRows(next);
        if (direction === "down") next = transpose(reverseRows(next));

        if (boardsEqual(board, next)) return;
        board = next;
        score += gained;
        if (score > best) {
          best = score;
          localStorage.setItem("retro2048Best", String(best));
        }

        addRandomTile();
        updateHeader();
        drawBoard();
        updateGameState();
      }

      function canMove() {
        if (emptyCells().length > 0) return true;
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (r + 1 < SIZE && board[r][c] === board[r + 1][c]) return true;
            if (c + 1 < SIZE && board[r][c] === board[r][c + 1]) return true;
          }
        }
        return false;
      }

      function updateGameState() {
        if (hasWon) {
          statusEl.textContent = "축하합니다! 2048 타일을 만들었습니다.";
          hasWon = false;
        } else if (!canMove()) {
          gameOver = true;
          statusEl.textContent = "게임 오버! 더 이상 움직일 수 없습니다.";
        } else {
          statusEl.textContent = "방향키로 타일을 합쳐 2048을 만드세요.";
        }
      }

      function resetGame() {
        board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
        score = 0;
        gameOver = false;
        hasWon = false;
        addRandomTile();
        addRandomTile();
        updateHeader();
        drawBoard();
        updateGameState();
      }

      window.addEventListener("keydown", (event) => {
        const key = event.key;
        if (!["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(key)) return;
        event.preventDefault();
        if (key === "ArrowUp") move("up");
        if (key === "ArrowDown") move("down");
        if (key === "ArrowLeft") move("left");
        if (key === "ArrowRight") move("right");
      });

      restartBtn.addEventListener("click", () => {
        if (!started) return;
        resetGame();
      });

      startBtn.addEventListener("click", () => {
        started = true;
        startOverlay.style.display = "none";
        resetGame();
      });

      updateHeader();
      drawBoard();
    </script>
  </body>
</html>
