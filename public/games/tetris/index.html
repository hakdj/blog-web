<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=640, user-scalable=no" />
    <title>React Tetris</title>
    <link rel="stylesheet" href="./loader.css" />
    <link rel="stylesheet" href="./css-1.0.1.css" />
    <style>
      body {
        margin: 0;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="load">
        <div class="loader">Loading...</div>
      </div>
    </div>
    <script src="./app-1.0.1.js"></script>
    <script>
      // 페이지 로드 시 포커스 확보
      window.addEventListener("load", () => {
        document.body.setAttribute("tabindex", "0");
        document.body.focus();
        window.focus();
      });

      // 전역 키 입력 처리 (스크롤 방지 + 포커스 유지)
      window.addEventListener("keydown", (e) => {
        const keys = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "p", "P"];
        if (keys.includes(e.key)) {
          e.preventDefault();
        }
      });
    </script>
  </body>
</html>
