<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Card</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      #wrap {
        text-align: center;
      }
      #info {
        font-size: 13px;
        color: #1f2937;
        margin-bottom: 8px;
      }
      #hint {
        font-size: 12px;
        color: #64748b;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="info">시도: 0 · 남은 카드: 16</div>
      <div id="hint">같은 그림 2개를 맞추세요.</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.min.js"></script>
    <script>
      const infoEl = document.getElementById("info");
      const icons = ["🎮", "📼", "📺", "🧩", "🎧", "🎲", "👾", "🕹️"];
      let tries = 0;
      let opened = [];
      let matched = 0;

      const config = {
        type: Phaser.AUTO,
        width: 320,
        height: 360,
        parent: "wrap",
        backgroundColor: "#f8fafc",
        scene: {
          create,
        },
      };

      new Phaser.Game(config);

      function create() {
        const deck = [...icons, ...icons].sort(() => Math.random() - 0.5);
        const cards = [];
        const startX = 30;
        const startY = 40;
        const gap = 8;
        const size = 60;

        deck.forEach((icon, idx) => {
          const row = Math.floor(idx / 4);
          const col = idx % 4;
          const x = startX + col * (size + gap);
          const y = startY + row * (size + gap);

          const rect = this.add.rectangle(x, y, size, size, 0xcbd5f5).setStrokeStyle(1, 0xe2e8f0);
          const text = this.add.text(x - 12, y - 16, "", { fontSize: "24px" });
          rect.setInteractive();
          rect.on("pointerdown", () => handleFlip(rect, text, icon));
          cards.push({ rect, text, icon, open: false, matched: false });
        });

        function handleFlip(rect, text, icon) {
          const card = cards.find((c) => c.rect === rect);
          if (!card || card.open || card.matched || opened.length === 2) return;
          card.open = true;
          rect.fillColor = 0xffffff;
          text.setText(icon);
          opened.push(card);
          if (opened.length === 2) {
            tries += 1;
            if (opened[0].icon === opened[1].icon) {
              opened.forEach((c) => (c.matched = true));
              opened = [];
              matched += 2;
              updateInfo();
              if (matched === 16) {
                this.add.text(70, 10, "완료! 🎉", { fontSize: "14px", color: "#16a34a" });
              }
            } else {
              this.time.delayedCall(600, () => {
                opened.forEach((c) => {
                  c.open = false;
                  c.rect.fillColor = 0xcbd5f5;
                  c.text.setText("");
                });
                opened = [];
              });
            }
            updateInfo();
          }
        }
      }

      function updateInfo() {
        infoEl.textContent = `시도: ${tries} · 남은 카드: ${16 - matched}`;
      }
    </script>
  </body>
</html>
