<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Card</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      #wrap {
        text-align: center;
      }
      #grid {
        display: grid;
        grid-template-columns: repeat(4, 70px);
        gap: 8px;
      }
      .card {
        width: 70px;
        height: 70px;
        border-radius: 10px;
        background: #cbd5f5;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        cursor: pointer;
        user-select: none;
      }
      .card.open {
        background: #ffffff;
        border: 1px solid #e2e8f0;
      }
      .info {
        margin-top: 8px;
        font-size: 12px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="grid"></div>
      <div class="info">같은 그림 2개를 맞추세요.</div>
    </div>
    <script>
      const icons = ["🎮", "📼", "📺", "🧩", "🎧", "🎲", "👾", "🕹️"];
      const cards = [...icons, ...icons].sort(() => Math.random() - 0.5);
      const grid = document.getElementById("grid");
      let opened = [];
      let matched = 0;

      function render() {
        grid.innerHTML = "";
        cards.forEach((icon, idx) => {
          const card = document.createElement("div");
          card.className = "card";
          card.dataset.index = idx;
          card.textContent = "";
          card.addEventListener("click", () => flip(idx));
          grid.appendChild(card);
        });
      }

      function flip(idx) {
        if (opened.length === 2) return;
        const cardEl = grid.children[idx];
        if (cardEl.classList.contains("open")) return;
        cardEl.classList.add("open");
        cardEl.textContent = cards[idx];
        opened.push({ idx, icon: cards[idx] });
        if (opened.length === 2) {
          const [a, b] = opened;
          if (a.icon === b.icon) {
            matched += 1;
            opened = [];
            if (matched === icons.length) {
              setTimeout(() => alert("완료! 🎉"), 200);
            }
          } else {
            setTimeout(() => {
              opened.forEach((item) => {
                const el = grid.children[item.idx];
                el.classList.remove("open");
                el.textContent = "";
              });
              opened = [];
            }, 600);
          }
        }
      }

      render();
    </script>
  </body>
</html>
